[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pegasus-framework"
version = "0.1.0"
description = "Core platform framework for backend services by Pegasus Online"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "PyJWT>=2.8,<3.0",
    "bcrypt">=3.2.2,<5.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pegasus_framework*"]

[project.optional-dependencies]

api = [
    "fastapi>=0.125.0,<1.0.0",
]

db = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.17",
    "pymysql>=1.1",
]

security = [
    "passlib[bcrypt]>=1.7.4",
]

dotenv = [
    "python-dotenv>=1.0",
]


